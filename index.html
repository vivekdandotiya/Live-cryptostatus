<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Live</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="header">
    <div class="container">

      <div class="brand">
        <h1>CryptoLive</h1>
        <p>Live Crypto Market</p>
      </div>

      <div class="search">
        <input type="text" placeholder="Search crypto..." />
      </div>

    </div>
  </header>

  <main>

    <section class="market-stats">
      <div class="container">

        <div class="stat-box">
          <p>Total Market Cap</p>
          <h3>$2.1T</h3>
        </div>

        <div class="stat-box">
          <p>24h Volume</p>
          <h3>$98B</h3>
        </div>

      </div>
    </section>

    <section class="crypto-list">
      <div class="container">

        <h2>Top Cryptocurrencies</h2>

        <div class="crypto-grid">

          <div class="crypto-card">
            <div class="coin-left">
              <div class="coin-logo">₿</div>
              <div class="coin-text">
                <h4>Bitcoin</h4>
                <span>BTC</span>
              </div>
            </div>
            <div class="coin-right">
              <p class="coin-price">$42,580.50</p>
              <span class="coin-change up">+2.45%</span>
            </div>
          </div>

          <div class="crypto-card">
            <div class="coin-left">
              <div class="coin-logo">Ξ</div>
              <div class="coin-text">
                <h4>Ethereum</h4>
                <span>ETH</span>
              </div>
            </div>
            <div class="coin-right">
              <p class="coin-price">$2,245.75</p>
              <span class="coin-change down">-1.23%</span>
            </div>
          </div>

          <div class="crypto-card">
            <div class="coin-left">
              <div class="coin-logo">◎</div>
              <div class="coin-text">
                <h4>Solana</h4>
                <span>SOL</span>
              </div>
            </div>
            <div class="coin-right">
              <p class="coin-price">$98.45</p>
              <span class="coin-change up">+5.67%</span>
            </div>
          </div>

          <div class="crypto-card">
            <div class="coin-left">
              <div class="coin-logo">Ð</div>
              <div class="coin-text">
                <h4>Dogecoin</h4>
                <span>DOGE</span>
              </div>
            </div>
            <div class="coin-right">
              <p class="coin-price">$0.0823</p>
              <span class="coin-change down">-3.21%</span>
            </div>
          </div>

        </div>

      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 CryptoLive</p>
    <p>LALA.. ghop ghop ghop </p>
  </footer>

</body>
</html>
