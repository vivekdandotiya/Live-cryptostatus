<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto-Live</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header class="header">
    <div class="container">

    
      <div class="brand">
        <h1>CryptoLive</h1>
        <p>Live Crypto Market</p>
      </div>

      <div class="search">
        <input type="text" placeholder="Search crypto..." />
      </div>
      </div>
  </header>

      <main>

    <section class="market-stats">
      <div class="container">

        <div class="stat-box">
          <p>Total Market Cap</p>
          <h3>$2.1T</h3>
        </div>

        <div class="stat-box">
          <p>24h Volume</p>
          <h3>$98B</h3>
        </div>

      </div>
    </section>

    <section class="crypto-list">
      <div class="container">

        <h2>Top Cryptocurrencies</h2>

        <div class="crypto-grid">
        </div>

      </div>
    </section>

  </main>
  
    <div class="crypto-card">
  <div class="coin-left">
    <div class="coin-logo">₿</div>
    <div class="coin-text">
      <h4>Bitcoin</h4>
      <span>BTC</span>
    </div>
  </div>

  <div class="coin-right">
    <p class="coin-price">$42,580.50</p>
    <span class="coin-change up">+2.45%</span>
  </div>
</div>


    
  <footer class="footer">
    <p>© 2026 CryptoLive</p>
  </footer>

  <!-- JS -->
  <script src="js/app.js"></script>
</body>
</html>
