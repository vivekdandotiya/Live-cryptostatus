<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Live</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-animated min-h-screen">

    <div id="introScreen" class="intro-screen">
  <div class="intro-logo-wrap">
    <img src="logo.png" alt="V Logo" class="intro-logo-img">
  </div>
</div>

<header class="border-b border-gray-800 backdrop-blur sticky top-0 z-50 bg-black/80">
  <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row justify-between gap-6">

    <div class="flex items-center gap-3">
  <img
    src="logo.png"
    alt="V Logo"
    class="w-12 h-12 object-contain header-logo"
  />

  <div class="flex flex-col">
    <h1 class="font-display text-3xl bg-gradient-to-r from-red-500 to-red-700 bg-clip-text text-transparent">
      CRYPTO
    </h1>
    <p class="text-xs text-gray-400 font-mono mt-1">Live Market</p>
  </div>
</div>


    <div class="flex gap-4">
      <div class="bg-gray-900 px-4 py-2 rounded-lg">
        <p class="text-xs text-gray-400">Market Cap</p>
        <p id="totalMarketCap" class="font-mono text-red-400">$0</p>
      </div>
      <div class="bg-gray-900 px-4 py-2 rounded-lg">
        <p class="text-xs text-gray-400">24h Volume</p>
        <p id="total24hVolume" class="font-mono text-red-400">$0</p>
      </div>
    </div>

  </div>

  <div class="pb-6 px-4">
    <div class="max-w-2xl mx-auto relative">
      <input
        id="searchInput"
        type="text"
        placeholder="Search cryptocurrency..."
        class="search-input w-full pl-4 pr-4 py-4 rounded-xl font-medium"
      />
    </div>
  </div>
</header>

<main class="container mx-auto px-4 py-8">

  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 bg-red-500 rounded-full pulse"></div>
      <span class="text-sm text-gray-400">Live prices (Binance)</span>
    </div>
    <div id="lastUpdate" class="font-mono text-gray-500">Live</div>
  </div>

  <div
    id="cryptoGrid"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
  </div>

  <div id="noResults" class="hidden text-center py-20">
    <h3 class="text-xl font-bold text-gray-400">No crypto found</h3>
    <p class="text-gray-500">mekaa laadle ghop ghop ghop..</p>
  </div>

</main>

<footer class="border-t border-gray-800 py-8 text-center">
  <p class="text-gray-500 text-sm">Kripya crypto ke bharose nhi rhe y L lga dega bo bhi ulte </p>
  <p class="text-gray-600 text-xs mt-1">@ Vivek</p>
</footer>

<script src="app.js"></script>
</body>
</html>
